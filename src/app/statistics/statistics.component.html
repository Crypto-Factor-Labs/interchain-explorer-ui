<div class="panel">
  <div class="stats-panel">
    <div class="stats-columns">
      <div class="column">
        <div class="cell">
          <div class="cell-content">
            <img class="cell-image" src="..\assets\images\CFR_token.png" alt="CFR-token" />
            <div class="cell-info">
              <div class="cell-heading">CFR PRICE</div>
              <span class="info-value">$ {{ statistics.cfr_price_usd }}</span>
            </div>
          </div>
        </div>
        <div class="cell">
          <div class="cell-heading"><i class="fa-solid fa-globe icon-heading"></i>CRYPTO FACTOR MARKET CAP</div>
          <span class="cell-value">$ {{ statistics.cfr_tvl_usd }}</span>
        </div>
      </div>
      <div class="column">
        <div class="cell">
          <div class="cell-heading"><i class="fa-solid fa-server icon-heading"></i>TRANSACTIONS</div>
          <span class="cell-value"># Transactions</span>
        </div>
        <div class="cell">
          <div class="cell-heading"><i class="fa-solid fa-gauge icon-heading"></i>BLOCK SPEED</div>
          <div class="cell-info-as-row">
            <div class="info-pair">
              <span class="info-label">Last 24 hours:</span>
              <span class="info-value">{{ statistics.avg_block_speed_24hr }}</span>
            </div>
            <div class="info-pair">
              <span class="info-label">Last 30 days:</span>
              <span class="info-value">{{ statistics.avg_block_speed_30d }}</span>
            </div>
          </div>
        </div>
      </div>
      <div class="column">
        <div class="cell">
          <div class="cell-heading">STATISTIC 5</div>
        </div>
        <div class="cell">
          <div class="cell-heading">STATISTIC 6</div>
        </div>
      </div>
    </div>
  </div>
</div>
