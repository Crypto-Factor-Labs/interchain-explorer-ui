<div *ngIf="masterBlock; else loading">
  <div class="panel">
    <div class="dialog-title">
      <div class="logo-pane">
        <img src="assets/images/interchain_logo.png" alt="Interchain Logo" class="logo-img"
          style="width: 36px; height: 36px;" />
      </div>
      <div class="title-text">
        <h2>Master Block</h2>
      </div>
      <div class="close-icon" (click)="dialogRef.close()">
        <i class="fa-solid fa-square-xmark"></i>
      </div>
    </div>

    <!-- Separator line -->
    <div class="separator"></div>

    <div class="fields-container">
      <div class="field">
        <div class="label">Height</div>
        <div class="value">{{ masterBlock.height | bnHexToDec }}</div>
      </div>
      <div class="field">
        <div class="label">Hash</div>
        <div class="value">{{ masterBlock.block_hash }}</div>
      </div>
      <div class="field">
        <div class="label">Timestamp</div>
        <div class="value">{{ masterBlock.timestamp }}</div>
      </div>
      <div class="field">
        <div class="label">Merkle Root</div>
        <div class="value">{{ masterBlock.merkle_root }}</div>
      </div>
      <div class="field">
        <div class="label">Mint Transaction</div>
        <div class="value">{{ masterBlock.block_mint_transaction }}</div>
      </div>
    </div>

    <!-- Separator line -->
    <div class="separator"></div>

    <!-- Close Button -->
    <div class="button-wrapper">
      <a class="close-btn" (click)="closeDialog()">
        <span class="btn-content">Close</span>
      </a>
    </div>
  </div>
</div>

<ng-template #loading>
  <p>Loading latest block data...</p>
</ng-template>
