<div *ngIf="masterBlock; else loading">
  <div class="panel">
    <h2>Master Block</h2>
    <div class="fields-container">
      <div class="field">
        <div class="label">Height</div>
        <div class="value">
          <span class="gradient-text">{{ masterBlock.height | bnHexToDec }}</span>
        </div>
      </div>
      <div class="field">
        <div class="label">Hash</div>
        <div class="value">
          <span class="gradient-text">{{ masterBlock.block_hash }}</span>
        </div>
      </div>
      <div class="field">
        <div class="label">Timestamp</div>
        <div class="value">
          <span class="gradient-text">{{ masterBlock.timestamp }}</span>
        </div>
      </div>
      <div class="field">
        <div class="label">Merkle Root</div>
        <div class="value">
          <span class="gradient-text">{{ masterBlock.merkle_root }}</span>
        </div>
      </div>
      <div class="field">
        <div class="label">Mint Transaction</div>
        <div class="value">
          <span class="gradient-text">{{ masterBlock.block_mint_transaction }}</span>
        </div>
      </div>
    </div>

    <!-- Separator line -->
    <div class="separator"></div>

    <!-- Back Button -->
    <a class="back-btn" (click)="goBack()">
      <span class="btn-content">
        <span class="arrow">&#8592;</span> Back
      </span>
    </a>
  </div>
</div>

<ng-template #loading>
  <p>Loading latest block data...</p>
</ng-template>

<div *ngIf="errMsg" class="error">
  <p>Error: {{ errMsg }}</p>
</div>
