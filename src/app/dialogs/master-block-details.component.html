<div class="field">
  <div class="label">Height</div>
  <div class="value">{{ masterBlock.height }}</div>
</div>

<div class="field">
  <div class="label">Hash</div>
  <div class="value hash-row">
    <code class="mono">{{ masterBlock.block_hash }}</code>
    <button type="button" class="icon-btn" [cdkCopyToClipboard]="masterBlock.block_hash"
      (cdkCopyToClipboardCopied)="onCopied($event)" aria-label="Copy block hash" title="Copy block hash">
      <i class="fa-solid fa-copy"></i>
    </button>
    <span class="copied" *ngIf="copied === true">Copied!</span>
    <span class="copied error" *ngIf="copied === false">Copy failed</span>
  </div>
</div>

<div class="field">
  <div class="label">Timestamp</div>
  <div class="value">{{ masterBlock.timestamp }}</div>
</div>

<div class="field">
  <div class="label">Merkle Root</div>
  <div class="value">{{ masterBlock.merkle_root }}</div>
</div>

<div class="field">
  <div class="label">Mint Transaction</div>
  <div class="value">{{ masterBlock.block_mint_transaction }}</div>
</div>
