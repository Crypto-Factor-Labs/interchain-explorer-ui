<div class="page-container" *ngIf="vm$ | async as vm">
  <ng-container *ngIf="vm.loading">Loading transactions…</ng-container>
  <div *ngIf="vm.error" class="error-box">Could not load transactions.</div>

  <app-panel *ngIf="!vm.loading" [panelTitle]="'Transactions'">
    <span *ngIf="vm.sender" panel-title-suffix>
      of <span class="hash-text" style="margin-left:2pt">{{ vm.sender }}</span>
    </span>
    <div class="section">
      <div class="field">
        <div class="label">Filter</div>
        <div class="value no-mono">
          <span class="inline-label">sender:</span>
          <span class="mono">{{ vm.sender || '— (all)' }}</span>
        </div>
      </div>

      <div class="field">
        <div class="label">Found</div>
        <div class="value no-mono">
          <span class="badge-state">{{ vm.txs.length }} txs</span>
        </div>
      </div>
    </div>

    <app-txs-list-lite [transactions]="vm.txs" (openTransaction)="onOpenTx($event)">
    </app-txs-list-lite>
  </app-panel>
</div>
